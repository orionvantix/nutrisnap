name: Infra CI/CD

on:
  push:
    branches:
      - "feature/**"
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/infra.yml"

  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/infra.yml"

  workflow_dispatch:
    inputs:
      tf_action:
        description: >-
          OPERATING RULES:
          1. feature/** branch: Runs ONLY 'Infra CI' (Validation).
          2. main branch: Runs 'Infra CI' followed by 'Infra CD' (Deployment).

          ⚠️ WARNING: "destroy" is IRREVERSIBLE. Default is "apply".
        required: true
        type: choice
        default: "apply"
        options:
          - apply
          - destroy

env:
  TF_VERSION: 1.7.0
  TF_WORKING_DIR: terraform

permissions:
  contents: read

jobs:
  infra-ci:
    name: Infra CI
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/')) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.base_ref == 'main' && github.event.action != 'closed')

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Terraform setup
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan (dry run)
        if: github.event_name == 'pull_request'
        env:
          TF_VAR_hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
          TF_VAR_ssh_public_key: ${{ secrets.VPS_SSH_PUBLIC_KEY }}
          TF_VAR_openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          TF_VAR_nutrisnap_secret: ${{ secrets.NUTRISNAP_SECRET }}
          TF_VAR_domain: ${{ secrets.NUTRISNAP_DOMAIN }}
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=nutrisnap/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -reconfigure
          terraform plan -out=tfplan
          echo "Plan complete. Review before merging to main."

  infra-cd:
    name: Infra CD
    runs-on: ubuntu-latest
    needs: infra-ci
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'push') &&
      (needs.infra-ci.result == 'success' || needs.infra-ci.result == 'skipped')

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Terraform setup
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        env:
          TF_VAR_hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
          TF_VAR_ssh_public_key: ${{ secrets.VPS_SSH_PUBLIC_KEY }}
          TF_VAR_openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          TF_VAR_nutrisnap_secret: ${{ secrets.NUTRISNAP_SECRET }}
          TF_VAR_domain: ${{ secrets.NUTRISNAP_DOMAIN }}
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=nutrisnap/terraform.tfstate" \
            -backend-config="region=us-east-1"

      - name: Terraform Action
        env:
          TF_VAR_hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
          TF_VAR_ssh_public_key: ${{ secrets.VPS_SSH_PUBLIC_KEY }}
          TF_VAR_openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          TF_VAR_nutrisnap_secret: ${{ secrets.NUTRISNAP_SECRET }}
          TF_VAR_domain: ${{ secrets.NUTRISNAP_DOMAIN }}
        run: |
          if [[ "${{ github.event.inputs.tf_action }}" == "destroy" ]]; then
            echo "🚨 DESTRUCTIVE ACTION INITIATED"
            terraform destroy -auto-approve
          else
            terraform plan -out=tfplan
            terraform apply -auto-approve tfplan
          fi

      - name: Show Terraform Output
        if: ${{ github.event.inputs.tf_action != 'destroy' }}
        run: terraform output
